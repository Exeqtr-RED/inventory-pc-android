# JVM для демона Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AndroidX вместо библиотек поддержки
android.useAndroidX=true
# Не транзитивные R-классы
android.nonTransitiveRClass=true
# Стиль кода Kotlin
kotlin.code.style=official
# AGP 8.5 официально поддерживает compileSdk 34; подавляем предупреждение для 35
android.suppressUnsupportedCompileSdk=35
